name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted Publishing (OIDC) requires a recent npm CLI; the version
      # bundled with setup-node can lag behind.
      - run: npm install -g npm@latest
      - run: npm ci
      # The pushed tag (e.g. v1.2.3) is the source of truth for the
      # published version, not the committed package.json.
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run build
      - run: npm publish --access public
