name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Noisy on dev-only CVEs? Use --omit=dev --audit-level=high instead.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run ts:check

      - name: Lint
        run: npm run lint

      # Formatting is enforced only by the pre-commit hook (see
      # tooling-stack.md), not CI — a PR should never be blocked purely
      # on formatting.
      - name: Test
        run: npm run test -- --ci

      - name: Dead code / unused exports / unused deps
        run: npm run deadcode

  # Native builds are slower and usually gated separately (nightly, or
  # only on release branches) rather than on every PR — add jobs like
  # the ones below only if the project wants build verification in CI,
  # not as a default. They need macos-latest (iOS) and a JDK setup
  # (Android) that the checks job above doesn't.
  #
  # android-build:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - uses: actions/setup-java@v4
  #       with: { distribution: temurin, java-version: "17" }
  #     - run: cd android && ./gradlew assembleDebug
  #
  # ios-build:
  #   runs-on: macos-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - run: cd ios && pod install
  #     - run: xcodebuild -workspace ios/*.xcworkspace -scheme <Scheme> -configuration Debug -sdk iphonesimulator build
