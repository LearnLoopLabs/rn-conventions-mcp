name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run ts:check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test -- --ci

      # Drop this step if the project doesn't have react-native-web /
      # web.bundler=metro in app.json — it's a build sanity check, not a
      # deploy. See ../docs/ci-verification-policy.md for why this only
      # runs in CI and isn't re-run locally after a task.
      - name: Web build
        run: npx expo export --platform web

      - name: Dead code / unused exports / unused deps
        run: npm run deadcode
